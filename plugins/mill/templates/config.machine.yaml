# ~/.millhouse/config.machine.yaml — machine-level overrides for mill.
#
# File location: $HOME/.millhouse/config.machine.yaml
# Lives outside every git repo — automatically untracked, no gitignore needed.
#
# Scope: one file per machine. All worktrees on this machine read it.
#
# Merge order (lowest -> highest precedence):
#   1. wiki/config.yaml                  - shared, git-tracked in the wiki
#   2. THIS FILE                         - per-machine, untracked
#   3. <worktree>/.millhouse/config.local.yaml  - per-worktree, highest precedence
#
# Typical uses:
#   - Machine-specific reviewer mode (e.g. cluster-gemini on a GPU-rich box,
#     sonnet elsewhere).
#   - Per-machine notification settings.
#
# mill-setup behaviour: probes for this file and reports status during Phase 4.95.
# mill-setup NEVER creates this file. Copy it by hand:
#   cp plugins/mill/templates/config.machine.yaml ~/.millhouse/config.machine.yaml
#
# Secrets DO NOT belong here. Put API keys in .env at the repo root.
#
# Examples (uncomment + edit to use):
#
# roles:
#   discussion-review:
#     holistic:
#       reviewer: cluster-gemini
#   plan-review:
#     holistic:
#       reviewer: cluster-gemini
#   code-review:
#     batch:
#       reviewer: cluster-gemini
#
# notifications:
#   toast: true
