# .millhouse/config.local.yaml — local, worktree-specific overrides.
#
# This file is gitignored (together with the rest of .millhouse/).
# It is a *partial overlay* on the shared wiki/config.yaml — include only
# the keys you want to override locally. Loaded by _review_common.load_config;
# local values win on any conflict.
#
# Secrets DO NOT belong here. Put API keys in .env at the repo root
# (standard dotenv convention). This file is for non-secret preferences.
#
# Examples (uncomment + edit to use):
#
# notifications:
#   toast: true
#
# review:
#   # Use a different reviewer for code review in this worktree only:
#   code:
#     reviewer: sonnetmax
#     style: multi
#
#   # Or lower the max rounds for discussion review:
#   discussion:
#     rounds: 1
