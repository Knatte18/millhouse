# .millhouse/config.local.yaml — local, worktree-specific overrides.
#
# This file is gitignored (together with the rest of .millhouse/).
# It is a *partial overlay* on the shared wiki/config.yaml — include only
# the keys you want to override locally. Loaded by _review_common.load_config;
# local values win on any conflict.
#
# Secrets DO NOT belong here. Put API keys in .env at the repo root
# (standard dotenv convention). This file is for non-secret preferences.
#
# Examples (uncomment + edit to use):
#
# hub_relative_path: .
#   The cwd-relative subpath where hub state (.active, .others, tasks.md,
#   .vscode/) should live. Written by mill-setup at setup time.
#   Use "." when cwd == git toplevel (typical for dedicated mill-managed repos).
#   Use a subpath (e.g. "src/Models") when mill is installed in a subfolder of
#   an existing repo and the user wants hub-state anchored there rather than
#   at the git root.
#
# notifications:
#   toast: true
#
# review:
#   # Use a different reviewer for code review in this worktree only:
#   code:
#     reviewer: sonnetmax
#     style: multi
#
#   # Or lower the max rounds for discussion review:
#   discussion:
#     rounds: 1
#
# wiki:
#   The wiki repo overrides. Default behaviour: derive
#   <origin>.wiki.git from the primary clone's origin URL and
#   clone the remote default branch. Set explicitly when using a
#   separate repo as the wiki, or to track a non-default branch
#   (one-repo-many-branches pattern).
#
#   repo_url: https://github.com/Org/shared.git
#     URL of the wiki repo. Set by /mill-setup --from-url <url>;
#     persisted automatically. Default: <origin>.wiki.git.
#
#   branch: wiki/millhouse
#     Branch to clone/track in the wiki repo. Set by
#     /mill-setup --branch <name>; persisted automatically.
#     Default: remote HEAD.
