# mill-config.yaml — millhouse hub overrides.
#
# Template defaults live in the plugin. Uncomment + change only what you need.
# Local per-machine overrides go in .millhouse/config.local.yaml (gitignored).
#
# Overlay precedence (first source wins):
#   plugin template -> this file -> .millhouse/config.local.yaml

# ---------------------------------------------------------------------------
# Repo identity
# ---------------------------------------------------------------------------

repo:
  short_name: MH

# ---------------------------------------------------------------------------
# Junctions
# ---------------------------------------------------------------------------

# junctions:
#   .wiki: <WIKI_PATH>
#   .portals: <CONTAINER_PATH>/portals/
#   .active: <CONTAINER_PATH>/portals/<SLUG>/

# ---------------------------------------------------------------------------
# mill-spawn
# ---------------------------------------------------------------------------

spawn:
  branch_prefix: "hanf/"

# ---------------------------------------------------------------------------
# Git integration
# ---------------------------------------------------------------------------

# git:
#   require_pr_to_base: true
#   base_branch: main

# ---------------------------------------------------------------------------
# File-path templates
# ---------------------------------------------------------------------------

# paths:
#   discussion_file: _mill/discussion.md
#   plan_dir:        _mill/plan/
#   reviews_dir:     _mill/reviews/
#   status_md:       _mill/status.md

# ---------------------------------------------------------------------------
# LLM-provider timeouts (seconds)
# ---------------------------------------------------------------------------

llm:
  bulk_timeout: 900
  # holistic_timeout: 1800
  # tool_use_timeout: 900
  implementer_timeout: 1800

# ---------------------------------------------------------------------------
# mill-go pipeline
# ---------------------------------------------------------------------------

pipeline:
  auto_merge: true
  # auto_report: true

