repo:
  short_name: MH
spawn:
  branch_prefix: hanf/
  sessions:
    start: { model: opus, effort: medium }
    plan: { model: opus, effort: medium }
    go: { model: sonnet, effort: high }
    quick: { model: sonnet, effort: high }
    orch: { model: opus, effort: high }
git:
  parent-branch: null
  require_pr_to_base: false
  base_branch: main
llm:
  bulk_timeout: 900
  holistic_timeout: 1800
  tool_use_timeout: 900
  implementer_timeout: 1800
  max_implementer_prompt_chars: 0
  claude:
    dispatch: agent
    psmux:
      shell_path: "${PWSH:-pwsh}"
      reuse_idle_timeout_s: 10
      response_poll_timeout_s:
        bulk: 300
        tool-use: 600
        implementer: 1800
pipeline:
  auto_merge: true
  auto_report: true
  max_cards_per_batch: 20
  max_batch_context_tokens: 700000
  entry_wait: true  # master on/off switch for the mill-go/mill-plan entry-gate blocking wait; see _phase_wait.py
  entry_wait_timeout_minutes: 240  # give-up timeout (minutes) for the entry-gate wait before halting
  parent_escalation_timeout_minutes: 60  # minutes ask-thread waits for a reply in either mode (automatic halt escalation, direct /ask-thread); 0 disables automatic escalation only, direct mode then waits the 60-minute default
  done_gate: null  # Repo-wide check command run from git_root before marking done; null = disabled. Default to including the language's lint command (e.g. golangci-lint run, ruff check .) even when a full test run is skipped as too slow. e.g. "go test ./... && golangci-lint run" or "dotnet test". (#561)
  done_gate_baseline_preflight: false  # Opt-in Prepare-phase done_gate baseline capture for self-capturing regression suites; see done_gate above. (#650)
  baseline_verify_timeout_minutes: null  # Per-run wall-clock ceiling (minutes) for every verify command --stage baseline runs (module-wide, per-batch); null = no ceiling. A timeout is treated as "computation failed, leave the baseline unset", the same fail-safe as any other infrastructure failure, so a hung test runner cannot block the pre-flight indefinitely before batch 1 dispatches. (#1101)
merge:
  model: sonnethigh
  verify_fix_rounds: 3
junctions:
  .wiki: <WIKI_PATH>
  .portals: <CONTAINER_PATH>/portals/
paths:
  discussion_file: _mill/discussion.md
  plan_dir: _mill/plan/
  reviews_dir: _mill/reviews/
  status_md: _mill/status.md
roles:
  discussion-review:
    holistic:
      rounds: 8
      min_rounds: 1
      auto_approve_on_cap: true
      reviewer: sonnethigh
      blocking_classes: [design]
  plan-review:
    holistic:
      rounds: 7
      min_rounds: 1
      auto_approve_on_cap: true
      reviewer: sonnethigh
      blocking_classes: [design, scope]
  code-review:
    holistic:
      rounds: 5
      min_rounds: 1
      auto_approve_on_cap: true
      reviewer: sonnethigh
      fallback_reviewer: null
      fallback_on:
      - rate-limit
      blocking_classes: [design, scope, decision, consistency]
  implementer:
    self_fix_rounds: 2
    model: sonnetmedium
  fixer:
    model: sonnetmedium
notify:
  backend: stdout
groom:
  brevity-threshold-lines: 5
  brevity-threshold-chars: 500
