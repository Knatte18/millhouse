repo:
  short_name: MH
spawn:
  branch_prefix: hanf/
llm:
  bulk_timeout: 900
  implementer_timeout: 1800
pipeline:
  auto_merge: true
junctions:
  .wiki: <WIKI_PATH>
  .portals: <CONTAINER_PATH>/portals/
paths:
  discussion_file: _mill/discussion.md
  plan_dir: _mill/plan/
  reviews_dir: _mill/reviews/
  status_md: _mill/status.md
roles:
  discussion-review:
    holistic:
      rounds: 3
      reviewer: sonnetmax_tool
  plan-review:
    batch:
      rounds: 0
      reviewer: null
    holistic:
      rounds: 3
      reviewer: sonnetmax
  code-review:
    batch:
      rounds: 0
      reviewer: null
    holistic:
      rounds: 3
      reviewer: sonnethigh
      fallback_reviewer: null
      fallback_on:
      - rate-limit
    diff_scope_threshold: 0.25
  implementer:
    self_fix_rounds: 2
    model: haiku
notify:
  backend: stdout
groom:
  brevity-threshold-lines: 5
  brevity-threshold-chars: 500
merge:
  verify_fix_rounds: 3
