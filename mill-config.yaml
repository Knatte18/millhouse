repo:
  short_name: MH
spawn:
  branch_prefix: hanf/
llm:
  bulk_timeout: 900
  implementer_timeout: 1800
  max_implementer_prompt_chars: 0
  claude:
    dispatch: agent
    psmux:
      shell_path: "${PWSH:-pwsh}"
      reuse_idle_timeout_s: 10
pipeline:
  auto_merge: true
  auto_report: true
  max_cards_per_batch: 10
  max_batch_context_tokens: 120000
  rename_detect_pct: 30
  entry_wait: true  # master on/off switch for the mill-go/mill-plan entry-gate blocking wait; see _phase_wait.py
  entry_wait_timeout_minutes: 240  # give-up timeout (minutes) for the entry-gate wait before halting
  done_gate: null  # Repo-wide check command run from git_root before marking done; null = disabled. Default to including the language's lint command (e.g. golangci-lint run, ruff check .) even when a full test run is skipped as too slow. e.g. "go test ./... && golangci-lint run" or "dotnet test". (#561)
  done_gate_baseline_preflight: false  # Opt-in Prepare-phase done_gate baseline capture for self-capturing regression suites; see done_gate above. (#650)
merge:
  model: sonnethigh
junctions:
  .wiki: <WIKI_PATH>
  .portals: <CONTAINER_PATH>/portals/
paths:
  discussion_file: _mill/discussion.md
  plan_dir: _mill/plan/
  reviews_dir: _mill/reviews/
  status_md: _mill/status.md
roles:
  discussion-review:
    holistic:
      rounds: 8
      min_rounds: 1
      reviewer: sonnethigh
      blocking_classes: [design]
  plan-review:
    batch:
      rounds: 0
      reviewer: null
      blocking_classes: [design, scope]
    holistic:
      rounds: 7
      min_rounds: 1
      reviewer: sonnethigh
      blocking_classes: [design, scope]
  code-review:
    batch:
      rounds: 0
      min_rounds: 1
      reviewer: null
      blocking_classes: [design, scope, decision, consistency]
    holistic:
      rounds: 5
      min_rounds: 1
      reviewer: sonnethigh
      fallback_reviewer: null
      fallback_on:
      - rate-limit
      blocking_classes: [design, scope, decision, consistency]
    diff_scope_threshold: 0.25
  implementer:
    self_fix_rounds: 2
    model: sonnetmedium
  fixer:
    model: sonnetmedium
notify:
  backend: stdout
groom:
  brevity-threshold-lines: 5
  brevity-threshold-chars: 500
