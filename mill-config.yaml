repo:
  short_name: MH
spawn:
  branch_prefix: hanf/
llm:
  bulk_timeout: 900
  implementer_timeout: 1800
  max_implementer_prompt_chars: 0
  claude:
    dispatch: agent
    psmux:
      shell_path: "${PWSH:-pwsh}"
      reuse_idle_timeout_s: 10
pipeline:
  auto_merge: true
  auto_report: true
  max_cards_per_batch: 10
  max_batch_context_tokens: 120000
merge:
  model: sonnethigh
junctions:
  .wiki: <WIKI_PATH>
  .portals: <CONTAINER_PATH>/portals/
paths:
  discussion_file: _mill/discussion.md
  plan_dir: _mill/plan/
  reviews_dir: _mill/reviews/
  status_md: _mill/status.md
roles:
  discussion-review:
    holistic:
      rounds: 5
      reviewer: opushigh
  plan-review:
    batch:
      rounds: 0
      reviewer: null
    holistic:
      rounds: 7
      reviewer: opushigh
  code-review:
    batch:
      rounds: 0
      reviewer: null
    holistic:
      rounds: 5
      reviewer: sonnethigh
      fallback_reviewer: null
      fallback_on:
      - rate-limit
    diff_scope_threshold: 0.25
  implementer:
    self_fix_rounds: 2
    model: sonnethigh
  fixer:
    model: haiku
notify:
  backend: stdout
groom:
  brevity-threshold-lines: 5
  brevity-threshold-chars: 500
